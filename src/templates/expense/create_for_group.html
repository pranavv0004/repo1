{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Add Expense to {{ group.name }}</h2>
        <a href="{{ url_for('view_group_expenses', group_id=group.group_id) }}" class="btn btn-secondary">Back to Expenses</a>
    </div>

    <form method="POST" class="mt-4">
        <input type="hidden" name="group_id" value="{{ group.group_id }}">
        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" class="form-control" id="description" name="description" required>
        </div>
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" class="form-control" id="amount" name="amount" step="0.01" required>
        </div>
        <div class="form-group">
            <label for="tag">Tag (Optional)</label>
            <input type="text" class="form-control" id="tag" name="tag">
        </div>
        <div class="form-group">
            <label>Split Between</label>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Share</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for member in group.members %}
                        <tr>
                            <td>{{ member.name }}</td>
                            <td>
                                <div class="input-group">
                                    <input type="number" class="form-control" name="share_{{ member.user_id }}" 
                                           value="1" min="0" step="1" required>
                                    <div class="input-group-append">
                                        <span class="input-group-text">shares</span>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Create Expense</button>
    </form>
</div>
{% endblock %}
